<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B6D11"/>
      <stop offset="1" stop-color="#173404"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF5FB"/>
      <stop offset="1" stop-color="#7FC4DC"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#639922"/>
      <stop offset="1" stop-color="#27500A"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Sky glow -->
  <circle cx="370" cy="150" r="60" fill="#EF9F27" opacity="0.85"/>
  <circle cx="370" cy="150" r="42" fill="#FFE896"/>
  <!-- Back mountains -->
  <path d="M0,300 L110,180 L200,270 L300,160 L410,280 L512,210 L512,512 L0,512 Z" fill="#3B6D11" opacity="0.55"/>
  <!-- Main mountain with waterfall -->
  <path d="M70,360 L200,150 L330,360 Z" fill="url(#mountain)"/>
  <!-- Waterfall -->
  <path d="M186,200 L214,200 L210,355 L190,355 Z" fill="url(#water)"/>
  <path d="M192,210 L208,210 L206,350 L194,350 Z" fill="white" opacity="0.6"/>
  <!-- Water pool with foam -->
  <ellipse cx="200" cy="362" rx="55" ry="12" fill="#EAF5FB" opacity="0.9"/>
  <!-- Foreground hills -->
  <path d="M0,400 Q130,350 260,395 Q390,430 512,380 L512,512 L0,512 Z" fill="url(#mountain)"/>
  <path d="M0,440 Q140,405 280,440 Q400,465 512,425 L512,512 L0,512 Z" fill="#173404"/>
  <!-- Trail dashes (winding path) -->
  <path d="M150,500 Q200,450 250,460 Q310,470 330,420" fill="none" stroke="#EF9F27" stroke-width="9" stroke-linecap="round" stroke-dasharray="4 22" opacity="0.95"/>
  <!-- Palm tree -->
  <g transform="translate(410,330)">
    <rect x="-5" y="0" width="10" height="95" rx="4" fill="#3B2817"/>
    <path d="M0,5 Q-55,-25 -75,-5 Q-50,-2 0,8" fill="#639922"/>
    <path d="M0,5 Q55,-25 75,-5 Q50,-2 0,8" fill="#3B6D11"/>
    <path d="M0,2 Q-45,30 -68,22 Q-40,15 0,10" fill="#3B6D11"/>
    <path d="M0,2 Q45,30 68,22 Q40,15 0,10" fill="#639922"/>
    <path d="M0,-2 Q-8,-42 -22,-52 Q-10,-35 -4,-2" fill="#7FB34E"/>
  </g>
</svg>
